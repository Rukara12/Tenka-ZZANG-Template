<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>텐카 템플릿 에디터</title>
<meta name="description" content="게임 추천 짤방을 만드는 편집기. 사진과 움짤을 얹고 문구를 고쳐 GIF·PNG·영상으로 저장합니다.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="bar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">텐카 템플릿</span>
  </div>

  <div class="bar-status" id="bar-status" aria-live="polite"></div>

  <div class="bar-actions">
    <button type="button" class="icon-btn" id="btn-undo" title="되돌리기 (Ctrl+Z)" aria-label="되돌리기" disabled>
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5L3 9l4 4M3.4 9H12a5 5 0 010 10H8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button type="button" class="icon-btn" id="btn-redo" title="다시하기 (Ctrl+Shift+Z)" aria-label="다시하기" disabled>
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M13 5l4 4-4 4M16.6 9H8a5 5 0 000 10h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button type="button" class="ghost-btn" id="btn-reset">처음부터</button>
    <button type="button" class="primary-btn" id="btn-export">내보내기</button>
  </div>
</header>

<main class="layout">
  <div class="stage-area">
    <div class="stage" id="stage-wrap">
      <canvas id="stage" width="1024" height="765" aria-label="편집 중인 짤방"></canvas>
      <canvas id="handles" class="handles"></canvas>
    </div>
    <p class="stage-tip" id="stage-tip">빈 칸을 눌러 사진을 넣고, 문구는 두 번 눌러 고칩니다. 스크린샷은 Ctrl+V 로 바로 붙여넣을 수 있습니다.</p>
  </div>

  <aside class="panel" id="panel" aria-label="설정">

    <!-- 아무것도 선택하지 않았을 때 -->
    <section class="insp" id="insp-none">
      <div class="insp-title">구성</div>
      <div class="slot-list" id="slot-list"></div>

      <div class="insp-title mt">문구</div>
      <div class="text-list" id="text-list"></div>
    </section>

    <!-- 사진 슬롯 선택 -->
    <section class="insp" id="insp-slot" hidden>
      <button type="button" class="back-btn" data-deselect>← 전체 보기</button>
      <div class="insp-title" id="slot-title">말풍선</div>

      <div class="row-2">
        <button type="button" class="ghost-btn" id="slot-replace">사진 바꾸기</button>
        <button type="button" class="ghost-btn danger" id="slot-remove">비우기</button>
      </div>

      <label class="field">
        <span class="field-label">크기 <b id="slot-scale-val">100%</b></span>
        <input type="range" id="slot-scale" min="2" max="600" step="1" value="100">
      </label>

      <label class="field">
        <span class="field-label">회전 <b id="slot-angle-val">0°</b></span>
        <input type="range" id="slot-angle" min="0" max="359" step="1" value="0">
      </label>

      <div class="row-3">
        <button type="button" class="ghost-btn" id="slot-rot90">90° 돌리기</button>
        <button type="button" class="ghost-btn" id="slot-flip">좌우 뒤집기</button>
        <button type="button" class="ghost-btn" id="slot-fit">칸에 맞추기</button>
      </div>

      <div class="meta" id="slot-meta"></div>

      <!-- 로고 전용 -->
      <div id="logo-effects" hidden>
        <div class="insp-title mt">로고 효과</div>

        <label class="switch">
          <input type="checkbox" id="fx-outline"><span>테두리</span>
        </label>
        <div class="sub" id="fx-outline-body" hidden>
          <label class="field">
            <span class="field-label">두께 <b id="fx-outline-w-val">2.5</b></span>
            <input type="range" id="fx-outline-w" min="0" max="20" step="0.5" value="2.5">
          </label>
          <label class="field inline">
            <span class="field-label">색</span>
            <input type="color" id="fx-outline-color" value="#000000">
          </label>
        </div>

        <label class="switch">
          <input type="checkbox" id="fx-shadow"><span>그림자</span>
        </label>
        <div class="sub" id="fx-shadow-body" hidden>
          <label class="field">
            <span class="field-label">번짐 <b id="fx-shadow-blur-val">10</b></span>
            <input type="range" id="fx-shadow-blur" min="0" max="60" step="1" value="10">
          </label>
          <label class="field">
            <span class="field-label">가로 <b id="fx-shadow-dx-val">5</b></span>
            <input type="range" id="fx-shadow-dx" min="-60" max="60" step="1" value="5">
          </label>
          <label class="field">
            <span class="field-label">세로 <b id="fx-shadow-dy-val">5</b></span>
            <input type="range" id="fx-shadow-dy" min="-60" max="60" step="1" value="5">
          </label>
          <label class="field inline">
            <span class="field-label">색</span>
            <input type="color" id="fx-shadow-color" value="#000000">
          </label>
        </div>
      </div>
    </section>

    <!-- 문구 선택 -->
    <section class="insp" id="insp-text" hidden>
      <button type="button" class="back-btn" data-deselect>← 전체 보기</button>
      <div class="insp-title" id="text-title">좌상단</div>

      <button type="button" class="ghost-btn wide" id="text-edit">문구 고치기</button>

      <label class="switch">
        <input type="checkbox" id="text-auto"><span>칸에 맞춰 크기 자동 조절</span>
      </label>

      <label class="field" id="text-size-field">
        <span class="field-label">글자 크기 <b id="text-size-val">41</b></span>
        <input type="range" id="text-size" min="8" max="200" step="1" value="41">
      </label>

      <label class="field">
        <span class="field-label">칸 너비 <b id="text-width-val">215</b></span>
        <input type="range" id="text-width" min="40" max="1024" step="1" value="215">
      </label>

      <label class="field inline">
        <span class="field-label">글자 색</span>
        <input type="color" id="text-color" value="#000000">
      </label>

      <div class="notice" id="text-overflow" hidden>
        <span>문구가 칸을 넘칩니다. 저장하면 사진 위로 흘러나갑니다.</span>
        <button type="button" class="ghost-btn" id="text-fit">칸에 맞추기</button>
      </div>

      <button type="button" class="ghost-btn wide" id="text-reset">위치·크기 되돌리기</button>
      <div class="meta" id="text-meta"></div>
    </section>

    <!-- 항상 보이는 도구 -->
    <section class="insp tools">
      <div class="insp-title">도구</div>

      <div class="search-row">
        <input type="search" id="sgdb-input" placeholder="게임 이름으로 로고 찾기" autocomplete="off">
        <button type="button" class="ghost-btn" id="sgdb-go">검색</button>
      </div>

      <button type="button" class="ghost-btn wide" id="font-pick">글꼴 바꾸기</button>
      <div class="meta" id="font-meta">평택 노을체</div>

      <div class="source-info" id="source-info" hidden></div>

      <div class="links">
        <a href="https://Rukara12.github.io/Tenka-ZZANG-Template/old/old.html" target="_blank" rel="noopener">구버전 에디터</a>
        <a href="https://github.com/Rukara12/Tenka-ZZANG-Template" target="_blank" rel="noopener">문제 알리기</a>
      </div>
    </section>
  </aside>
</main>

<!-- 내보내기 -->
<dialog id="export-dialog" class="dialog">
  <form method="dialog" class="dialog-inner">
    <h2 class="dialog-title">내보내기</h2>

    <div class="seg" id="fmt-seg" role="radiogroup" aria-label="형식">
      <button type="button" data-fmt="gif" class="seg-btn is-on">GIF</button>
      <button type="button" data-fmt="png" class="seg-btn">PNG</button>
      <button type="button" data-fmt="video" class="seg-btn">영상</button>
    </div>

    <label class="field inline">
      <span class="field-label">크기</span>
      <select id="ex-scale">
        <option value="0.5">0.5배 (512×383)</option>
        <option value="0.75">0.75배 (768×574)</option>
        <option value="1" selected>1배 (1024×765)</option>
        <option value="1.5">1.5배 (1536×1148)</option>
        <option value="2">2배 (2048×1530)</option>
      </select>
    </label>

    <div id="motion-fields">
      <label class="field inline">
        <span class="field-label">초당 프레임</span>
        <select id="ex-fps">
          <option value="0" selected>원본 속도</option>
          <option value="10">10</option>
          <option value="15">15</option>
          <option value="20">20</option>
          <option value="25">25</option>
          <option value="30">30</option>
        </select>
      </label>
      <label class="field inline">
        <span class="field-label">재생 속도</span>
        <select id="ex-speed">
          <option value="0.5">0.5배</option>
          <option value="1" selected>1배</option>
          <option value="1.5">1.5배</option>
          <option value="2">2배</option>
        </select>
      </label>
      <label class="field inline" id="ex-colors-field">
        <span class="field-label">색 수</span>
        <select id="ex-colors">
          <option value="64">64색 (가장 가벼움)</option>
          <option value="128">128색</option>
          <option value="255" selected>255색 (가장 선명)</option>
        </select>
      </label>
    </div>

    <div class="estimate" id="ex-estimate"></div>

    <div id="ex-measure-wrap">
      <button type="button" class="ghost-btn wide" id="ex-measure">용량 측정</button>
      <div class="size-table" id="ex-sizes" hidden></div>
    </div>

    <div class="progress" id="ex-progress" hidden>
      <div class="progress-track"><div class="progress-fill" id="ex-progress-fill"></div></div>
      <div class="progress-text" id="ex-progress-text"></div>
    </div>

    <div class="dialog-actions">
      <button type="button" class="ghost-btn" id="ex-cancel">닫기</button>
      <button type="button" class="primary-btn" id="ex-run">저장</button>
    </div>
  </form>
</dialog>

<div class="toasts" id="toasts" aria-live="polite"></div>

<input type="file" id="file-input" accept="image/*" hidden>
<input type="file" id="font-input" accept=".ttf,.otf,.woff,.woff2" hidden>

<div class="drop-veil" id="drop-veil" hidden><span>여기에 놓으면 들어갑니다</span></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
